<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0b0f19; color: #00e5ff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    .jarvis-circle { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #00e5ff; box-shadow: 0 0 25px #00e5ff; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; cursor: pointer; transition: 0.3s; animation: pulse 2s infinite; }
    .jarvis-circle.listening { border-color: #ff0055; box-shadow: 0 0 35px #ff0055; animation: pulse-red 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes pulse-red { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
    #status { font-size: 1.1rem; margin-bottom: 15px; color: #fff; }
    #chat-log { max-width: 500px; min-height: 80px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; border: 1px solid #1f293d; color: #e2e8f0; margin-bottom: 20px; font-size: 0.95rem; }
    .btn { background: #00e5ff; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #00b4d8; }
  </style>
</head>
<body>
  <h1>JARVIS</h1>
  <div style="margin: 15px 0;">
    <div id="orb" class="jarvis-circle" onclick="toggleListening()">
      <span style="font-size: 2rem;">🎙️</span>
    </div>
  </div>
  <p id="status">Click the orb or button to start talking</p>
  <div id="chat-log">JARVIS is ready.</div>
  <button class="btn" onclick="toggleListening()">Activate Voice</button>

  <script>
    const statusText = document.getElementById('status');
    const chatLog = document.getElementById('chat-log');
    const orb = document.getElementById('orb');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        orb.classList.add('listening');
        statusText.innerText = "Listening...";
      };

      recognition.onend = () => {
        isListening = false;
        orb.classList.remove('listening');
        statusText.innerText = "Processing...";
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        chatLog.innerText = "You: " + text;
        handleCommand(text);
      };
    } else {
      statusText.innerText = "Speech recognition not supported in this browser. Please use Chrome.";
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function handleCommand(cmd) {
      const lower = cmd.toLowerCase();

      // Built-in offline quick commands
      if (lower.includes('time')) {
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const res = `Sir, the current time is ${timeNow}.`;
        chatLog.innerText = "JARVIS: " + res;
        speak(res);
        statusText.innerText = "Ready";
        return;
      }

      if (lower.includes('open youtube')) {
        speak("Opening YouTube, Sir.");
        window.open('https://youtube.com', '_blank');
        statusText.innerText = "Ready";
        return;
      }

      if (lower.includes('open google')) {
        speak("Opening Google.");
        window.open('https://google.com', '_blank');
        statusText.innerText = "Ready";
        return;
      }

      // Send everything else to Gemini AI
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: cmd })
        });
        const data = await res.json();
        
        if (data.error) {
          chatLog.innerText = "Error: " + data.error;
          speak("Sorry Sir, there was an error connecting to Gemini.");
        } else {
          chatLog.innerText = "JARVIS: " + data.reply;
          speak(data.reply);
        }
      } catch (err) {
        chatLog.innerText = "Failed to fetch response.";
        speak("I could not reach the server.");
      }
      statusText.innerText = "Click to talk";
    }
  </script>
</body>
</html>
