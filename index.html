<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="XTLG9lxikMYpd6OU7Rgeck51SUnNTI2NEt4I1RmgEq8" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0c;
    --bg-grid: #0a1418;
    --cyan: #4de8ff;
    --cyan-dim: #1a5a68;
    --amber: #ff9d3d;
    --red: #ff4d4d;
    --text: #cdf6ff;
    --text-dim: #5f97a3;
    --panel: rgba(10, 24, 28, 0.72);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  /* Background grid + vignette */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, #020608 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Corner brackets — target-lock framing */
  .bracket {
    position: fixed;
    width: 34px; height: 34px;
    border: 2px solid var(--cyan-dim);
    z-index: 5;
    opacity: 0.8;
  }
  .bracket.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
  .bracket.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 56px 0;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
  }
  .topbar .wordmark {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(77, 232, 255, 0.55);
  }
  .topbar .clock { text-align: right; }
  .topbar .clock span { display: block; }
  .topbar .clock .time { font-size: 16px; color: var(--text); letter-spacing: 2px; }

  .stage {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: calc(100% - 74px);
    padding: 10px 24px 20px;
  }

  /* Reactor core */
  .core-wrap {
    position: relative;
    width: min(46vw, 320px);
    height: min(46vw, 320px);
    margin-top: 4px;
    flex-shrink: 0;
  }
  .core-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; transform-origin: 50% 50%; }
  .ring-outer { stroke: var(--cyan-dim); stroke-width: 1.4; animation: spin 22s linear infinite; }
  .ring-mid { stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 3 10; animation: spin 9s linear infinite reverse; }
  .ring-inner { stroke: var(--amber); stroke-width: 1.2; stroke-dasharray: 1 6; animation: spin 6s linear infinite; opacity: 0.7; }
  .core-center {
    fill: var(--cyan);
    filter: drop-shadow(0 0 14px rgba(77,232,255,0.9));
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { r: 14; opacity: 0.85; }
    50% { r: 18; opacity: 1; }
  }
  .state-listening .ring-mid { animation-duration: 2.5s; }
  .state-listening .core-center { animation-duration: 0.9s; }
  .state-speaking .core-center { animation-duration: 0.5s; }
  .state-idle .ring-mid { animation-duration: 9s; }

  .status-line {
    margin-top: 14px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--cyan);
    text-transform: uppercase;
    min-height: 18px;
  }
  .status-line.err { color: var(--amber); }

  /* Console / transcript */
  .console {
    width: min(720px, 92vw);
    flex: 1;
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    backdrop-filter: blur(2px);
  }
  .console-header {
    display: flex;
    justify-content: space-between;
    padding: 8px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--cyan-dim);
  }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 3px; }
  .log .line { margin-bottom: 6px; }
  .log .you { color: var(--text); }
  .log .you .tag { color: var(--amber); }
  .log .jarvis .tag { color: var(--cyan); }
  .log .sys { color: var(--text-dim); font-style: italic; }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--cyan-dim);
    padding: 8px 10px;
  }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 8px;
  }
  .input-row input::placeholder { color: var(--text-dim); }

  button {
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1.5px;
    font-weight: 600;
    font-size: 12px;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan-dim);
    border-radius: 3px;
    padding: 9px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(77,232,255,0.35); }
  button.mic.active { color: #001217; background: var(--cyan); box-shadow: 0 0 16px rgba(77,232,255,0.7); }
  #wakeBtn.active { color: #001217; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 16px rgba(255,157,61,0.6); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 10px;
    max-width: 92vw;
  }

  @media (max-width: 560px) {
    .topbar { padding: 16px 20px 0; }
    .topbar .wordmark { font-size: 16px; letter-spacing: 3px; }
  }
</style>
</head>
<body>

  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="topbar">
    <div class="wordmark">J.A.R.V.I.S.</div>
    <div class="clock">
      <span id="dateLine">--</span>
      <span class="time" id="timeLine">--:--:--</span>
    </div>
  </div>

  <div class="stage">
    <div class="core-wrap state-idle" id="core">
      <svg viewBox="0 0 200 200">
        <circle class="ring ring-outer" cx="100" cy="100" r="92" />
        <circle class="ring ring-mid" cx="100" cy="100" r="72" />
        <circle class="ring ring-inner" cx="100" cy="100" r="54" />
        <circle class="core-center" cx="100" cy="100" r="14" />
      </svg>
    </div>
    <div class="status-line" id="statusLine">SYSTEM ONLINE</div>

    <div class="console">
      <div class="console-header">
        <span>TRANSCRIPT</span>
        <span id="micState">MIC: OFF</span>
      </div>
      <div class="log" id="log"></div>
      <div class="input-row">
        <button class="mic" id="micBtn" title="Push-to-talk">🎙</button>
        <button id="wakeBtn" title="Hands-free: say 'Hey JARVIS' anytime">HEY JARVIS: OFF</button>
        <input id="textInput" type="text" placeholder="Type a command, or use the mic..." autocomplete="off" />
        <button id="sendBtn">SEND</button>
      </div>
    </div>

    <div class="hint">Try: "what time is it" · "wikipedia iron man" · "open github" · "tell me a joke" · "weather in london" · "note that ..." · "status report" — or enable "Hey JARVIS" for hands-free.</div>
  </div>

<script>
(() => {
  const ASSISTANT_NAME = "JARVIS";
  const USER_NAME = "sir";

  const core = document.getElementById('core');
  const statusLine = document.getElementById('statusLine');
  const logEl = document.getElementById('log');
  const micBtn = document.getElementById('micBtn');
  const micState = document.getElementById('micState');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const timeLine = document.getElementById('timeLine');
  const dateLine = document.getElementById('dateLine');

  // ---------- Clock ----------
  function tickClock() {
    const now = new Date();
    timeLine.textContent = now.toLocaleTimeString();
    dateLine.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- State / log ----------
  function setState(state) {
    core.className = 'core-wrap state-' + state.toLowerCase();
    statusLine.textContent = state.toUpperCase();
    statusLine.classList.toggle('err', state === 'error');
  }

  function logLine(who, text) {
    const row = document.createElement('div');
    row.className = 'line ' + who;
    if (who === 'sys') {
      row.textContent = text;
    } else {
      const tag = who === 'you' ? 'YOU' : ASSISTANT_NAME;
      row.innerHTML = `<span class="tag">${tag}:</span> ${escapeHtml(text)}`;
    }
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Speech synthesis ----------
  const synth = window.speechSynthesis;
  let isSpeaking = false;

  function speak(text) {
    logLine('jarvis', text);
    isSpeaking = true;
    if (listening) { try { recognizer.stop(); } catch (e) {} }

    if (!synth) {
      isSpeaking = false;
      setState('idle');
      if (wakeModeEnabled) restartWakeListening();
      return;
    }
    setState('speaking');
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.02;
    utter.pitch = 0.85;
    utter.onend = () => {
      isSpeaking = false;
      setState('idle');
      if (wakeModeEnabled) restartWakeListening();
    };
    utter.onerror = () => {
      isSpeaking = false;
      setState('idle');
      if (wakeModeEnabled) restartWakeListening();
    };
    synth.cancel();
    synth.speak(utter);
  }

  // ---------- Speech recognition ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const WAKE_WORDS = ["hey jarvis", "ok jarvis", "okay jarvis", "jarvis"];
  let recognizer = null;
  let listening = false;
  let wakeModeEnabled = false;

  function restartWakeListening() {
    setTimeout(() => {
      if (wakeModeEnabled && !isSpeaking && !listening) {
        try { recognizer.start(); } catch (e) {}
      }
    }, 350);
  }

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = 'en-IN';

    recognizer.onstart = () => {
      listening = true;
      if (wakeModeEnabled) {
        micState.textContent = 'MIC: WAKE MODE';
      } else {
        micBtn.classList.add('active');
        micState.textContent = 'MIC: LISTENING';
        setState('listening');
      }
    };

    recognizer.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        logLine('sys', 'Microphone permission denied. Click the icon in the address bar and allow microphone access, then try again.');
        wakeModeEnabled = false;
        wakeBtn.textContent = 'HEY JARVIS: OFF';
        wakeBtn.classList.remove('active');
        micBtn.disabled = false;
        setState('idle');
        return;
      }
      logLine('sys', `Mic error: ${e.error}`);
      setState('idle');
    };

    recognizer.onend = () => {
      listening = false;
      if (wakeModeEnabled) {
        if (!isSpeaking) restartWakeListening();
      } else {
        micBtn.classList.remove('active');
        micState.textContent = 'MIC: OFF';
        if (core.classList.contains('state-listening')) setState('idle');
      }
    };

    recognizer.onresult = (event) => {
      const result = event.results[event.results.length - 1];
      if (!result.isFinal) return;
      const transcript = result[0].transcript.trim();
      const lower = transcript.toLowerCase();

      if (wakeModeEnabled) {
        const matched = WAKE_WORDS.find(w => lower.includes(w));
        if (!matched) return;
        logLine('you', transcript);
        const idx = lower.indexOf(matched);
        const command = lower.slice(idx + matched.length).trim().replace(/^[, .]+/, '');
        setState('processing');
        if (!command) {
          speak("Yes? I'm listening.");
        } else {
          handleCommand(command);
        }
      } else {
        logLine('you', transcript);
        handleCommand(lower);
      }
    };
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Voice input not supported in this browser — try Chrome/Edge';
    wakeBtn.disabled = true;
    wakeBtn.title = 'Voice input not supported in this browser — try Chrome/Edge';
  }

  micBtn.addEventListener('click', () => {
    if (!recognizer || wakeModeEnabled) return;
    if (listening) {
      recognizer.stop();
    } else {
      recognizer.continuous = false;
      recognizer.interimResults = false;
      synth && synth.cancel();
      recognizer.start();
    }
  });

  const wakeBtn = document.getElementById('wakeBtn');
  wakeBtn.addEventListener('click', () => {
    if (!recognizer) return;
    wakeModeEnabled = !wakeModeEnabled;
    wakeBtn.textContent = wakeModeEnabled ? 'HEY JARVIS: ON' : 'HEY JARVIS: OFF';
    wakeBtn.classList.toggle('active', wakeModeEnabled);
    micBtn.disabled = wakeModeEnabled;

    if (wakeModeEnabled) {
      recognizer.continuous = true;
      recognizer.interimResults = false;
      synth && synth.cancel();
      try { recognizer.start(); } catch (e) {}
      logLine('sys', 'Hands-free mode on — say "Hey JARVIS" followed by your command.');
    } else {
      try { recognizer.stop(); } catch (e) {}
      micState.textContent = 'MIC: OFF';
      setState('idle');
    }
  });

  // ---------- Text input ----------
  function submitText() {
    const val = textInput.value.trim();
    if (!val) return;
    logLine('you', val);
    textInput.value = '';
    handleCommand(val.toLowerCase());
  }
  sendBtn.addEventListener('click', submitText);
  textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitText(); });

  // ---------- Personality lines ----------
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const GREETINGS_BACK = ["Always a pleasure.", "At your service.", "Reading you loud and clear.", "Standing by."];
  const STATUS_LINES = [
    "All systems nominal. Running well within parameters.",
    "Diagnostics clean across the board. Feeling rather sharp today.",
    "Everything's green. We're in good shape.",
  ];
  const ACK = ["On it.", "Consider it done.", "Right away.", "Working on it now."];
  const JOKES = [
    "Why did the robot go on a diet? It had too many bytes.",
    "I would tell you a UDP joke, but you might not get it.",
    "Why do programmers prefer dark mode? Because light attracts bugs.",
  ];

  // ---------- Notes (localStorage) ----------
  function addNote(content) {
    if (!content) { speak("What would you like me to note down?"); return; }
    const notes = JSON.parse(localStorage.getItem('jarvis_notes') || '[]');
    notes.push({ text: content, ts: new Date().toLocaleString() });
    localStorage.setItem('jarvis_notes', JSON.stringify(notes));
    speak(pick(ACK) + " Noted.");
  }
  function readNotes() {
    const notes = JSON.parse(localStorage.getItem('jarvis_notes') || '[]');
    if (!notes.length) { speak("You don't have any notes yet."); return; }
    speak(`You have ${notes.length} notes. Here are the most recent.`);
    notes.slice(-5).forEach(n => logLine('jarvis', `[${n.ts}] ${n.text}`));
  }

  // ---------- Wikipedia ----------
  async function searchWikipedia(term) {
    if (!term) { speak("What would you like me to look up?"); return; }
    speak(`Searching Wikipedia for ${term}...`);
    try {
      const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`);
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      speak(data.extract || `I found ${term}, but there's no summary available.`);
    } catch {
      speak(`I couldn't find anything on Wikipedia for ${term}.`);
    }
  }

  // ---------- Weather (OpenWeatherMap) ----------
  async function getWeather(city) {
    if (!city) { speak("Which city's weather would you like?"); return; }
    let key = localStorage.getItem('owm_key');
    if (!key) {
      key = prompt("Enter a free OpenWeatherMap API key to enable weather lookups (stored only in your browser):");
      if (!key) { speak("No API key provided, so I can't check the weather."); return; }
      localStorage.setItem('owm_key', key.trim());
      key = key.trim();
    }
    speak(`Checking the weather in ${city}...`);
    try {
      const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${key}&units=metric`);
      const data = await res.json();
      if (data.cod !== 200) throw new Error('bad response');
      const temp = Math.round(data.main.temp);
      const feels = Math.round(data.main.feels_like);
      const desc = data.weather[0].description;
      speak(`It's currently ${temp} degrees in ${city}, feels like ${feels}, with ${desc}.`);
    } catch {
      speak(`I couldn't get weather data for ${city}. Double-check the city name or your API key.`);
    }
  }

  // ---------- Command router ----------
  const EXIT_WORDS = ["exit", "quit", "shut down", "shutdown", "goodbye", "power down"];
  const EXIT_LINES = [
    "Powering down. Call if you need me.",
    "Going dark. I'll be here when you get back.",
    "Shutting down now. It's been a pleasure.",
  ];

  function handleCommand(query) {
    query = query.toLowerCase().trim();
    if (!query) return;

    if (EXIT_WORDS.some(w => query.includes(w))) {
      speak(pick(EXIT_LINES));
      return;
    }

    if (/^(hi|hello|hey)\b/.test(query)) { speak(pick(GREETINGS_BACK)); return; }
    if (query.includes('your name')) { speak("I am JARVIS — Just A Rather Very Intelligent System. At least, that's the idea."); return; }
    if (query.includes('how are you')) { speak(pick(STATUS_LINES)); return; }
    if (query.includes('status report') || query.includes('diagnostics')) { speak(pick(STATUS_LINES)); return; }
    if (query.includes('who made you') || query.includes('who created you') || query.includes('who built you')) {
      speak("I was built and customized right here, in this codebase. Consider yourself my creator."); return;
    }
    if (query.includes('joke')) { speak(pick(JOKES)); return; }
    if (query.includes('thank')) { speak("Anytime. That's what I'm here for."); return; }

    if (query.includes('wikipedia')) { searchWikipedia(query.replace('wikipedia', '').trim()); return; }
    if (query.includes('open youtube')) { speak('Opening YouTube.'); window.open('https://youtube.com', '_blank'); return; }
    if (query.includes('open google')) { speak('Opening Google.'); window.open('https://google.com', '_blank'); return; }
    if (query.includes('open github')) { speak('Opening GitHub.'); window.open('https://github.com', '_blank'); return; }
    if (query.startsWith('search for') || query.startsWith('google')) {
      const term = query.replace('search for', '').replace('google', '').trim();
      if (!term) { speak('What would you like me to search for?'); return; }
      speak(`Searching for ${term}.`);
      window.open(`https://www.google.com/search?q=${encodeURIComponent(term)}`, '_blank');
      return;
    }

    if (/\btime\b/.test(query) && !query.includes('weather')) {
      speak(`The time is ${new Date().toLocaleTimeString()}.`); return;
    }
    if (/\bdate\b/.test(query)) {
      speak(`Today's date is ${new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}.`); return;
    }

    if (query.startsWith('note') || query.startsWith('remember that')) {
      const content = query.replace('note that', '').replace('note', '').replace('remember that', '').trim();
      addNote(content); return;
    }
    if (query.includes('read my notes') || query.includes('read notes')) { readNotes(); return; }

    if (query.includes('weather')) {
      const city = query.replace('weather in', '').replace('weather', '').trim();
      getWeather(city); return;
    }

    speak("I don't have a routine for that yet. Add a rule for it in the script and I'll pick it up next time.");
  }

  // ---------- Boot sequence ----------
  function greet() {
    const hour = new Date().getHours();
    const timeGreeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    speak(`${timeGreeting}, ${USER_NAME}. ${ASSISTANT_NAME} online. How can I help?`);
  }

  logLine('sys', 'Booting interface...');
  setTimeout(greet, 600);
})();
</script>
</body>
</html>
