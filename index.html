<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="XTLG9lxikMYpd6OU7Rgeck51SUnNTI2NEt4I1RmgEq8" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0c;
    --bg-grid: #0a1418;
    --cyan: #4de8ff;
    --cyan-dim: #1a5a68;
    --amber: #ff9d3d;
    --red: #ff4d4d;
    --text: #cdf6ff;
    --text-dim: #5f97a3;
    --panel: rgba(10, 24, 28, 0.72);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  /* Background grid + vignette */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 42px 42px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, #020608 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* Corner brackets — target-lock framing */
  .bracket {
    position: fixed;
    width: 34px; height: 34px;
    border: 2px solid var(--cyan-dim);
    z-index: 5;
    opacity: 0.8;
  }
  .bracket.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
  .bracket.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 56px 0;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
  }
  .topbar .wordmark {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(77, 232, 255, 0.55);
  }
  .topbar .clock { text-align: right; }
  .topbar .clock span { display: block; }
  .topbar .clock .time { font-size: 16px; color: var(--text); letter-spacing: 2px; }

  .stage {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: calc(100% - 74px);
    padding: 10px 24px 20px;
  }

  /* Reactor core */
  .core-wrap {
    position: relative;
    width: min(46vw, 320px);
    height: min(46vw, 320px);
    margin-top: 4px;
    flex-shrink: 0;
  }
  .core-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; transform-origin: 50% 50%; }
  .ring-outer { stroke: var(--cyan-dim); stroke-width: 1.4; animation: spin 22s linear infinite; }
  .ring-mid { stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 3 10; animation: spin 9s linear infinite reverse; }
  .ring-inner { stroke: var(--amber); stroke-width: 1.2; stroke-dasharray: 1 6; animation: spin 6s linear infinite; opacity: 0.7; }
  .core-center {
    fill: var(--cyan);
    filter: drop-shadow(0 0 14px rgba(77,232,255,0.9));
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { r: 14; opacity: 0.85; }
    50% { r: 18; opacity: 1; }
  }
  .state-listening .ring-mid { animation-duration: 2.5s; }
  .state-listening .core-center { animation-duration: 0.9s; }
  .state-speaking .core-center { animation-duration: 0.5s; }
  .state-idle .ring-mid { animation-duration: 9s; }

  .status-line {
    margin-top: 14px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--cyan);
    text-transform: uppercase;
    min-height: 18px;
  }
  .status-line.err { color: var(--amber); }

  /* Console / transcript */
  .console {
    width: min(720px, 92vw);
    flex: 1;
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    backdrop-filter: blur(2px);
  }
  .console-header {
    display: flex;
    justify-content: space-between;
    padding: 8px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--cyan-dim);
  }
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 3px; }
  .log .line { margin-bottom: 6px; }
  .log .you { color: var(--text); }
  .log .you .tag { color: var(--amber); }
  .log .jarvis .tag { color: var(--cyan); }
  .log .sys { color: var(--text-dim); font-style: italic; }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-top: 1px solid var(--cyan-dim);
    padding: 8px 10px;
  }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 8px;
  }
  .input-row input::placeholder { color: var(--text-dim); }

  button {
    font-family: 'Chakra Petch', sans-serif;
    letter-spacing: 1.5px;
    font-weight: 600;
    font-size: 12px;
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan-dim);
    border-radius: 3px;
    padding: 9px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(77,232,255,0.35); }
  button.mic.active { color: #001217; background: var(--cyan); box-shadow: 0 0 16px rgba(77,232,255,0.7); }
  #wakeBtn.active { color: #001217; background: var(--amber); border-color: var(--amber); box-shadow: 0 0 16px rgba(255,157,61,0.6); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .hint {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 10px;
    max-width: 92vw;
  }

  @media (max-width: 560px) {
    .topbar { padding: 16px 20px 0; }
    .topbar .wordmark { font-size: 16px; letter-spacing: 3px; }
  }
</style>
</head>
<body>

  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="topbar">
    <div class="wordmark">J.A.R.V.I.S.</div>
    <div class="clock">
      <span id="dateLine">--</span>
      <span class="time" id="timeLine">--:--:--</span>
    </div>
  </div>

  <div class="stage">
    <div class="core-wrap state-idle" id="core">
      <svg viewBox="0 0 200 200">
        <circle class="ring ring-outer" cx="100" cy="100" r="92" />
        <circle class="ring ring-mid" cx="100" cy="100" r="72" />
        <circle class="ring ring-inner" cx="100" cy="100" r="54" />
        <circle class="core-center" cx="100" cy="100" r="14" />
      </svg>
    </div>
    <div class="status-line" id="statusLine">SYSTEM ONLINE</div>

    <div class="console">
      <div class="console-header">
        <span>TRANSCRIPT</span>
        <span id="micState">MIC: OFF</span>
      </div>
      <div class="log" id="log"></div>
      <div class="input-row">
        <button class="mic" id="micBtn" title="Push-to-talk">🎙</button>
        <button id="wakeBtn" title="Hands-free: say 'Hey JARVIS' anytime">HEY JARVIS: OFF</button>
        <input id="textInput" type="text" placeholder="Type a command, or use the mic..." autocomplete="off" />
        <button id="sendBtn">SEND</button>
      </div>
    </div>

    <div class="hint">Try: "what time is it" · "who was alan turing" · "open github" · "tell me a joke" · "explain quantum physics" · "note that ..." · "status report"</div>
  </div>

<script>
(() => {
  const ASSISTANT_NAME = "JARVIS";
  const USER_NAME = "sir";
  const GEMINI_API_KEY = "AQ.Ab8RN6LID0wKjbaN4S-P2tNMZUCER7WHVq7pngToBGfwZt-V2g";

  const core = document.getElementById('core');
  const statusLine = document.getElementById('statusLine');
  const logEl = document.getElementById('log');
  const micBtn = document.getElementById('micBtn');
  const micState = document.getElementById('micState');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const timeLine = document.getElementById('timeLine');
  const dateLine = document.getElementById('dateLine');

  // ---------- Clock ----------
  function tickClock() {
    const now = new Date();
    timeLine.textContent = now.toLocaleTimeString();
    dateLine.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- State / log ----------
  function setState(state) {
    core.className = 'core-wrap state-' + state.toLowerCase();
    statusLine.textContent = state.toUpperCase();
    statusLine.classList.toggle('err', state === 'error');
  }

  function logLine(who, text) {
    const row = document.createElement('div');
    row.className = 'line ' + who;
    if (who === 'sys') {
      row.textContent = text;
    } else {
      const tag = who === 'you' ? 'YOU' : ASSISTANT_NAME;
      row.innerHTML = `<span class="tag">${tag}:</span> ${escapeHtml(text)}`;
    }
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Speech synthesis ----------
  const synth = window.speechSynthesis;
  let isSpeaking = false;

  function speak(text) {
    logLine('jarvis', text);
    isSpeaking = true;
    if (listening) { try { recognizer.stop(); } catch (e) {} }

    if (!synth) {
      isSpeaking = false;
      setState('idle');
      if (wakeModeEnabled) restartWakeListening();
      return;
    }
    setState('speaking');
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.02;
    utter.pitch = 0.85;
    utter.onend = () => {
      isSpeaking = false;
      setState('idle');
      if (wakeModeEnabled) restartWakeListening();
    };
    utter.onerror = () => {
      isSpeaking = false;
      setState('idle');
      if (wakeModeEnabled) restartWakeListening();
    };
    synth.cancel();
    synth.speak(utter);
  }

  // ---------- Google Gemini Brain ----------
  async function askGemini(promptText) {
    setState('processing');
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          systemInstruction: {
            parts: [{ text: `You are J.A.R.V.I.S., Tony Stark's concise, intelligent, and polite AI assistant. Address the user as 'sir'. Keep answers spoken, brief, punchy, and clear without markdown asterisks or special formatting.` }]
          }
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `HTTP error ${res.status}`);
      }

      const data = await res.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (reply) {
        speak(reply.trim());
      } else {
        speak("I received an empty response from the network, sir.");
      }
    } catch (err) {
      console.error(err);
      speak(`I ran into an issue connecting with Google, sir: ${err.message || 'connection failed'}`);
    }
  }

  // ---------- Speech recognition ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const WAKE_WORDS = ["hey jarvis", "ok jarvis", "okay jarvis", "jarvis"];
  let recognizer = null;
  let listening = false;
  let wakeModeEnabled = false;

  function restartWakeListening() {
    setTimeout(() => {
      if (wakeModeEnabled && !isSpeaking && !listening) {
        try { recognizer.start(); } catch (e) {}
      }
    }, 350);
  }

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = 'en-IN';

    recognizer.onstart = () => {
      listening = true;
      if (wakeModeEnabled) {
        micState.textContent = 'MIC: WAKE MODE';
      } else {
        micBtn.classList.add('active');
        micState.textContent = 'MIC: LISTENING';
        setState('listening');
      }
    };

    recognizer.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        logLine('sys', 'Microphone permission denied. Click the icon in the address bar and allow microphone access, then try again.');
        wakeModeEnabled = false;
        wakeBtn.textContent = 'HEY JARVIS: OFF';
        wakeBtn.classList.remove('active');
        micBtn.disabled = false;
        setState('idle');
        return;
      }
      logLine('sys', `Mic error: ${e.error}`);
      setState('idle');
    };

    recognizer.onend = () => {
      listening = false;
      if (wakeModeEnabled) {
        if (!isSpeaking) restartWakeListening();
      } else {
        micBtn.classList.remove('active');
        micState.textContent = 'MIC: OFF';
        if (core.classList.contains('state-listening')) setState('idle');
      }
    };

    recognizer.onresult = (event) => {
      const result = event.results[event.results.length - 1];
      if (!result.isFinal) return;
      const transcript = result[0].transcript.trim();
      const lower = transcript.toLowerCase();

      if (wakeModeEnabled) {
        const matched = WAKE_WORDS.find(w => lower.includes(w));
        if (!matched) return;
        logLine('you', transcript);
        const idx = lower.indexOf(matched);
        const command = lower.slice(idx + matched.length).trim().replace(/^[, .]+/, '');
        setState('processing');
        if (!command) {
          speak("Yes? I'm listening.");
        } else {
          handleCommand(command);
        }
      } else {
        logLine('you', transcript);
        handleCommand(lower);
      }
    };
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Voice input not supported in this browser — try Chrome/Edge';
    wakeBtn.disabled = true;
    wakeBtn.title = 'Voice input not supported in this browser — try Chrome/Edge';
  }

  micBtn.addEventListener('click', () => {
    if (!recognizer || wakeModeEnabled) return;
    if (listening) {
      recognizer.stop();
    } else {
      recognizer.continuous = false;
      recognizer.interimResults = false;
      synth && synth.cancel();
      recognizer.start();
    }
  });

  const wakeBtn = document.getElementById('wakeBtn');
  wakeBtn.addEventListener('click', () => {
    if (!recognizer) return;
    wakeModeEnabled = !wakeModeEnabled;
    wakeBtn.textContent = wakeModeEnabled ? 'HEY JARVIS: ON' : 'HEY JARVIS: OFF';
    wakeBtn.classList.toggle('active', wakeModeEnabled);
    micBtn.disabled = wakeModeEnabled;

    if (wakeModeEnabled) {
      recognizer.continuous = true;
      recognizer.interimResults = false;
      synth && synth.cancel();
      try { recognizer.start(); } catch (e) {}
      logLine('sys', 'Hands-free mode on — say "Hey JARVIS" followed by your command.');
    } else {
      try { recognizer.stop();
